<!doctype html>

<title>Unidades que Atendemos</title>
<style>
/* Painel 2,00 m x 1,25 m, fundo transparente, tudo em vetor. Escala sem perda para qualquer tamanho. */
:root{
  --navy:#0B2A4F;
  --azul:#005AAA;
  --azul2:#1C7FD6;
  --azul3:#5EB3F2;
  --fonte:"Helvetica Neue",Helvetica,"Nimbus Sans TT","Nimbus Sans",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;font-family:var(--fonte)}
.panel{width:2000mm;height:1250mm;position:relative;overflow:hidden;background:transparent}
.title{position:absolute;left:90mm;top:70mm}
.title .bar{width:120mm;height:9mm;background:var(--azul2);border-radius:5mm;margin-bottom:22mm}
.title h1{margin:0;font-size:120mm;line-height:1;font-weight:700;color:var(--navy);letter-spacing:-.02em}
.title p{margin:18mm 0 0;font-size:36mm;letter-spacing:.32em;text-transform:uppercase;color:var(--azul);font-weight:400}
svg.map{position:absolute;left:0;top:0;width:2000mm;height:1250mm}
.pill{fill:var(--azul2)}
.pill-t{font-size:34px;font-weight:700;fill:#fff;letter-spacing:.02em}
.lead{stroke:var(--azul2);stroke-width:3px;fill:none}
.pin{fill:#fff;stroke:var(--azul);stroke-width:3px}
.pin-c{fill:var(--azul)}
</style>
</head>
